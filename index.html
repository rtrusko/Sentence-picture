<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sentence Picture Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Shantell+Sans:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* comic palette sampled from the banner, logo and boat */
  --ink:#121212; --ink-soft:#4A4A52;
  --paper:#FFFFFF; --paper-shade:#F2F4F7; --line:#121212; --line-soft:#C9CED6;
  --red:#E8291C; --red-deep:#A8170D;
  --orange:#FF8A1F;
  --yellow:#FFE11A; --yellow-deep:#E0A800;
  --cyan:#19B7F2;
  --blue:#1468D6; --blue-deep:#0B3F8C;
  --navy:#1B2D6B;
  --sky:#EAF7FF;
  --sky-top:#3EB7FE; --sky-bottom:#1B7FDB;
  --redpen:#E8291C;
  --radius:14px;
  --comic-shadow:5px 5px 0 var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--sky-bottom)}
html.locked{background:#fff}
html,body{min-height:100%}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  /* game pages: the banner's comic sky, with a faint halftone like the art */
  background:
    radial-gradient(rgba(255,255,255,.16) 1.4px, transparent 1.6px) 0 0/14px 14px,
    linear-gradient(180deg, var(--sky-top) 0, var(--sky-bottom) 900px) no-repeat,
    var(--sky-bottom);
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:18px 14px 60px;
}
h1,h2,h3{font-family:'Shantell Sans','Comic Sans MS',cursive}
button{font-family:inherit;cursor:pointer;border:none}
input,textarea{font-family:inherit}
a{color:var(--blue)}
.card h2,.dock h2.board{font-family:'Luckiest Guy','Shantell Sans',cursive;font-weight:400;letter-spacing:.5px}
:root{--page:1080px}
.wrap{width:100%;max-width:var(--page)}
.brand{width:100%;max-width:var(--page);margin:0 auto 18px;user-select:none}
/* laptop layouts */
@media (min-width:860px){
  .wrap.home{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  .wrap.home .card + .card{margin-top:0}
  .wrap.home .tiny{grid-column:1 / -1}
  .brand.compact .banner{height:160px;object-fit:cover;object-position:50% 0%}
  .banner{transition:height .25s ease}
  .draw-grid{display:grid;grid-template-columns:minmax(280px,340px) 1fr;gap:22px;align-items:start}
  .draw-side .toolbar .swatch{width:30px;height:30px}
}
.canvas-holder{max-width:calc(74vh * 4 / 3);margin:0 auto}
.panel .drawing,.panel .comic{max-width:calc(70vh * 4 / 3);margin-left:auto;margin-right:auto}
.prev-entry .drawing{max-width:calc(48vh * 4 / 3);margin:0 auto}
.banner{display:block;width:100%;height:auto;border-radius:16px;box-shadow:var(--comic-shadow);border:3px solid var(--ink)}
.brand.locked{display:none}
.banner-btn{position:relative;display:block;width:100%;padding:0;background:none;border:none;cursor:zoom-in;border-radius:16px}
.banner-btn:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
.explore-tag{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;gap:6px;background:var(--ink);color:#fff;font-weight:800;font-size:12px;padding:6px 10px;border-radius:999px;pointer-events:none;opacity:.92}
.explore-tag svg{width:14px;height:14px}
.viewer{position:fixed;inset:0;z-index:60;background:#fff;display:flex;flex-direction:column}
.viewer-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;cursor:grab;overscroll-behavior:contain}
.viewer-scroll.dragging{cursor:grabbing}
.viewer-stage{display:flex;align-items:center;justify-content:center;min-width:100%;min-height:100%}
.viewer-img{display:block;max-width:none;user-select:none;-webkit-user-drag:none;border-radius:6px}
.viewer-bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:3px solid var(--ink)}
.viewer-bar button{min-width:46px;height:42px;padding:0 14px;border-radius:12px;background:#fff;color:var(--ink);border:3px solid var(--ink);font-weight:800;font-size:18px}
.viewer-bar button.close{background:var(--red);color:#fff;font-size:15px}
.viewer-hint{position:absolute;top:calc(12px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:var(--ink);font-weight:800;font-size:13px;pointer-events:none;transition:opacity .6s;text-shadow:0 0 6px #fff,0 0 6px #fff}
.brand.intro .banner,.brand.intro .explore-tag{visibility:hidden}
#app.intro-hold{opacity:0}
#app.intro-in{animation:introCards .6s ease both}
@keyframes introCards{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.intro-overlay{position:fixed;inset:0;z-index:50;background:#fff;cursor:pointer;overflow:hidden}
.intro-img{position:fixed;transform-origin:50% 50%;max-width:none;will-change:transform,opacity;pointer-events:none}
.intro-skip{position:fixed;bottom:22px;left:0;right:0;text-align:center;color:var(--ink);font-weight:800;font-size:13px;letter-spacing:1px;pointer-events:none;text-shadow:0 0 6px #fff,0 0 6px #fff,0 0 6px #fff}
.dock{max-width:520px;margin:0 auto;position:relative}
.logo{display:block;width:min(86vw,470px,42vh);height:auto;margin:0 auto -4px}
.dock h2.board{font-family:'Luckiest Guy','Shantell Sans',cursive;letter-spacing:.5px;font-weight:400;color:var(--ink);text-align:center;font-size:clamp(24px,6vw,34px);line-height:1.1;margin:6px 0 8px}
.boat-wrap{position:relative;width:min(84vw,420px,40vh);margin:0 auto;z-index:1}
.boat{display:block;width:100%;height:auto;transform-origin:50% 90%;
  -webkit-mask-image:linear-gradient(#000 82%,transparent 99%);mask-image:linear-gradient(#000 82%,transparent 99%);
}
.dock .card{margin-top:-34px;z-index:2}
.dock .lock-note{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink-soft);font-weight:700;margin-top:12px;line-height:1.45}
.dock .lock-note svg{flex:none;width:14px;height:14px;margin-top:2px}
.card{
  background:var(--paper);border-radius:var(--radius);
  border:3px solid var(--ink);box-shadow:var(--comic-shadow);
  padding:22px 20px 24px;position:relative;
}
.card + .card{margin-top:16px}
.card h2{font-size:24px;margin-bottom:6px;line-height:1.1}
.card .hint{color:var(--ink-soft);font-size:14px;line-height:1.5;margin-bottom:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;font-size:17px;font-weight:700;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:10px;outline:none}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,104,214,.18)}
.btn{display:block;width:100%;padding:13px;border-radius:12px;font-size:17px;font-weight:800;background:var(--red);color:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink)}
.btn.gold{background:var(--yellow);color:var(--ink)}
.btn.lake{background:var(--blue);color:#fff}
.btn.small{width:auto;padding:9px 16px;font-size:14px;display:inline-block}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn + .btn{margin-top:10px}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--ink-soft);font-weight:800;font-size:12px;letter-spacing:2px}
.divider::before,.divider::after{content:"";flex:1;height:3px;background:var(--ink);border-radius:2px}
.errmsg{color:var(--redpen);font-weight:700;font-size:14px;margin-top:10px;min-height:18px}
.okmsg{color:#2E7D4F;font-weight:700;font-size:14px;margin-top:10px}
.prompt-label{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
.round-pill{float:right;background:var(--navy);color:#fff;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:800}
.prev-entry{background:var(--sky);border:3px dashed var(--ink);border-radius:12px;padding:14px;margin-bottom:16px}
.prev-entry .who{font-size:12px;font-weight:800;color:var(--ink-soft);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.prev-entry .sentence{font-family:'Shantell Sans',cursive;font-size:20px;font-weight:700;line-height:1.35;white-space:pre-wrap}
.drawing{width:100%;border-radius:8px;display:block;background:#fff}
.comic{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--ink);padding:6px;border-radius:10px}
.comic.n1{grid-template-columns:1fr}
.comic-pane{background:#fff;border-radius:6px;overflow:hidden}
.comic-pane .drawing{border-radius:0}
@media (max-width:480px){.comic{grid-template-columns:1fr}}
textarea.write{
  width:100%;min-height:144px;resize:none;overflow:hidden;
  background:repeating-linear-gradient(transparent,transparent 31px,rgba(43,42,51,.14) 31px,rgba(43,42,51,.14) 32px);
  border:3px solid var(--ink);border-radius:10px;padding:8px 14px;
  font-family:'Shantell Sans',cursive;font-size:19px;font-weight:600;line-height:32px;color:var(--ink);outline:none;
}
textarea.write:focus{border-color:var(--blue)}
textarea.paste{width:100%;min-height:90px;resize:vertical;border:3px solid var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;color:var(--ink);outline:none;word-break:break-all}
textarea.paste:focus{border-color:var(--blue)}
.pane-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tab{padding:7px 12px;border-radius:999px;background:#fff;border:2.5px solid var(--ink);font-weight:800;font-size:13px;color:var(--ink)}
.tab.sel{background:var(--yellow)}
.tab.add{border-style:dashed;color:var(--blue)}
.tab.del{color:var(--redpen)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.swatch{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--ink)}
.swatch.sel{box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--ink);transform:scale(1.06)}
.sizebtn{width:36px;height:32px;border-radius:8px;background:#fff;border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center}
.sizebtn.sel{background:var(--yellow)}
.sizebtn span{border-radius:50%;background:var(--ink);display:block}
.tool{height:32px;padding:0 12px;border-radius:8px;background:#fff;border:2.5px solid var(--ink);font-weight:800;font-size:13px;color:var(--ink)}
.tool.sel{background:var(--yellow)}
.canvas-holder{border:3px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff;touch-action:none;overscroll-behavior:contain}
canvas.pad{display:block;width:100%;height:auto;touch-action:none;-webkit-user-select:none;user-select:none}
.passbox{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px;max-height:150px;overflow:auto;font-size:12px;font-weight:600;word-break:break-all;color:var(--ink-soft);white-space:pre-wrap}
.bigmark{text-align:center;margin:4px 0 10px}
.bigmark svg{width:72px;height:72px}
.strip{perspective:1200px}
.panel{background:var(--paper);padding:16px 18px;border-bottom:3px dashed var(--ink);transform-origin:top center;animation:unfold .55s cubic-bezier(.34,1.3,.5,1) both}
.panel:first-child{border-radius:var(--radius) var(--radius) 0 0}
.panel .who{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--blue);text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.panel .sentence{font-family:'Shantell Sans',cursive;font-size:20px;font-weight:700;line-height:1.35;white-space:pre-wrap}
@keyframes unfold{from{transform:rotateX(-88deg);opacity:0;box-shadow:0 30px 40px rgba(0,0,0,.4)}to{transform:rotateX(0);opacity:1;box-shadow:none}}
@media (prefers-reduced-motion: reduce){.panel{animation:none}}
.foldbtn{width:100%;padding:15px;border-radius:0 0 11px 11px;background:var(--yellow);color:var(--ink);font-family:'Luckiest Guy','Shantell Sans',cursive;font-size:20px;letter-spacing:.5px}
.strip-shadowbox{border-radius:var(--radius);border:3px solid var(--ink);box-shadow:var(--comic-shadow);overflow:hidden}
.reveal-actions{margin-top:18px}
.gamelist{display:flex;flex-direction:column;gap:8px}
.gamerow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:10px;padding:10px 12px;color:var(--ink)}
.gamerow:active{background:var(--paper-shade)}
.gamerow .gdate{font-size:12px;font-weight:800;color:var(--ink-soft);min-width:58px}
.gamerow .gmain{flex:1;min-width:0}
.gamerow .gtitle{font-family:'Shantell Sans',cursive;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gamerow .gmeta{font-size:12px;color:var(--ink-soft);font-weight:700}
.gamerow .gstatus{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--paper-shade);color:var(--ink-soft)}
.gamerow .gstatus.live{background:var(--yellow);color:var(--ink)}
body.locked{background:#fff}
body:not(.locked) .tiny{color:rgba(255,255,255,.9)}
body:not(.locked) .tiny a{color:#fff}
body:not(.locked) footer{color:rgba(255,255,255,.85)}
.tiny{color:var(--ink-soft);font-size:12px;font-weight:700;text-align:center;margin-top:16px}
.tiny a{color:var(--blue);text-decoration:underline;cursor:pointer}
.pwrow{display:flex;gap:8px}
.pwrow input{flex:1}
.pwrow button{width:auto;padding:0 14px;border-radius:10px;background:#fff;border:3px solid var(--ink);font-weight:800;font-size:13px}
.ico{width:16px;height:16px;flex:none}
footer{margin-top:26px;color:var(--ink-soft);font-size:12px;font-weight:700;text-align:center;max-width:var(--page);line-height:1.5}
.hidden{display:none !important}
</style>

<body>

<div class="brand">
  <button class="banner-btn" id="bannerBtn" type="button" aria-label="Open the banner to look around"><img class="banner" src="banner.jpg" srcset="banner-800.jpg 800w, banner.jpg 1600w" sizes="(max-width: 1100px) 100vw, 1080px" width="1600" height="686" alt="Sentence Picture Game: raccoons crash a speedboat into a beach house while seagulls steal pizza and jellyfish panic"><span class="explore-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M10.5 7.5v6M7.5 10.5h6"/></svg>look closer</span></button>
</div>

<div class="wrap" id="app"></div>

<footer>One shared paper floating in the lake. Everyone opens the game, checks the paper, and takes their fold. Everything is scrambled with the family password before it leaves your phone.</footer>

<script>
/* =====================================================
   Sentence Picture Game
   - one shared paper per game, stored encrypted in Pantry
   - "Check the paper" finds the active game, no links/pasting
   - past games archive
   - multi-panel comic drawings + photo upload
===================================================== */
const $ = s => document.querySelector(s);
const app = $('#app');
const W = 1000, H = 750;
const COLORS = ['#121212','#8B4513','#E8291C','#22A63E','#FF8A1F','#1468D6','#FFD21A','#8A8F98','#FF6FAE','#7B3FD1'];
const SIZES = [2,5,10,20];
const MAX_PANES = 6;

/* >>> your Pantry (getpantry.cloud) <<< */
const PANTRY_ID = 'a64ed0ed-aef9-4cdb-a718-8380fc5b7f8b';
const usePantry = /^[A-Za-z0-9\-]{20,}$/.test(PANTRY_ID);
const INDEX_BASKET = 'spgindex';
const PANTRY_BASE = 'https://getpantry.cloud/apiv1/pantry/';

const ICON_WROTE = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 14 q5 -6 10 0 q5 -6 10 0"/></svg>';
const ICON_DREW = '<svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M4 11 A8 8 0 0 1 20 11 L18 13 L16 11 L14 13 L12 11 L10 13 L8 11 L6 13 Z"/><path d="M8 14 q-2 4 0 8 M12 14 q2 4 0 8 M16 14 q-2 4 0 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';

const S = {
  screen:'home', state:null, myName:'', err:'', ok:'',
  revealShown:1, passReady:false,
  key:null, pendingHash:null, pwWrong:false,
  index:null, activeGame:null, loadingHome:false,
};

/* ---------- local storage ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function saveLocalRoom(){ if(S.state && S.state.room) lsSet('spgRoom', S.state.room); }
function localRoom(){ return lsGet('spgRoom'); }

/* ---------- bytes / base64 / compression ---------- */
const te = new TextEncoder(), td = new TextDecoder();
function b64url(bytes){
  let bin=''; for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64url(str){
  str = str.replace(/-/g,'+').replace(/_/g,'/');
  while(str.length % 4) str += '=';
  const bin = atob(str);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}
const canCompress = typeof CompressionStream !== 'undefined';
async function deflate(bytes){
  if(!canCompress) return bytes;
  const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();
  return new Uint8Array(buf);
}
async function inflate(bytes){
  const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
  return new Uint8Array(buf);
}

/* ---------- encryption (family password) ---------- */
async function deriveKey(pw){
  const km = await crypto.subtle.importKey('raw', te.encode(pw.normalize('NFKC')), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: te.encode('sentence-picture-family-v1'), iterations:120000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function setPassword(pw){ S.key = await deriveKey(pw); lsSet('spgPw', pw); S.pwWrong=false; }
async function loadPassword(){ const pw = lsGet('spgPw'); if(pw){ try{ S.key = await deriveKey(pw); }catch(e){} } }
function forgetPassword(){ S.key=null; lsDel('spgPw'); }
async function encryptBytes(bytes){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, S.key, bytes));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
}
async function decryptBytes(bytes){
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv: bytes.slice(0,12)}, S.key, bytes.slice(12)));
}
/* wrapped record: {v:2, c:1|0, enc:b64} */
async function sealJson(obj){
  const raw = te.encode(JSON.stringify(obj));
  const body = await deflate(raw);
  return {v:2, c: canCompress?1:0, enc: b64url(await encryptBytes(body))};
}
async function openJson(wrapped){
  if(!wrapped) return null;
  if(wrapped.enc){
    if(!S.key) throw new Error('nokey');
    let bytes = await decryptBytes(unb64url(wrapped.enc));
    if(wrapped.c) bytes = await inflate(bytes);
    return JSON.parse(td.decode(bytes));
  }
  return wrapped; // legacy unencrypted
}

/* ---------- pass-along codes (backup path) ---------- */
async function packState(state){
  const raw = te.encode(JSON.stringify(state));
  if(S.key){
    const body = await deflate(raw);
    return (canCompress?'SPG2.':'SPG3.') + b64url(await encryptBytes(body));
  }
  if(canCompress) return 'SPG1.' + b64url(await deflate(raw));
  return 'SPG0.' + b64url(raw);
}
async function unpackState(text){
  text = text || '';
  const cands = [];
  const strict = text.match(/SPG([0-3])\.([A-Za-z0-9_\-]+)/);
  if(strict) cands.push([strict[1], strict[2]]);
  const loose = text.match(/SPG([0-3])\.([\s\S]+)$/);
  if(loose) cands.push([loose[1], loose[2].replace(/[^A-Za-z0-9_\-]/g,'')]);
  let sawEncrypted = false;
  for(const [ver, body] of cands){
    try{
      let bytes = unb64url(body);
      if(ver==='2' || ver==='3'){
        sawEncrypted = true;
        if(!S.key) throw new Error('nokey');
        bytes = await decryptBytes(bytes);
        if(ver==='2') bytes = await inflate(bytes);
      } else if(ver==='1'){
        bytes = await inflate(bytes);
      }
      const st = JSON.parse(td.decode(bytes));
      if(st && Array.isArray(st.entries)) return st;
    }catch(e){}
  }
  return sawEncrypted ? 'badkey' : null;
}

/* ---------- Pantry storage ---------- */
function pantryUrl(basket){ return PANTRY_BASE + PANTRY_ID + '/basket/' + basket; }
function randId(){ let s=''; const A='abcdefghjkmnpqrstuvwxyz23456789'; for(let i=0;i<12;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }
/* last network outcome, so the screen can say WHY a save or load failed */
let lastNet = {ok:true, what:''};
function noteNet(ok, what){ lastNet = {ok, what}; }
async function basketGet(b){
  if(!usePantry) return null;
  try{
    const r = await fetch(pantryUrl(b), {cache:'no-store'});
    if(r.ok){ noteNet(true,''); return await r.json(); }
    const txt = (await r.text().catch(()=>'')).slice(0,120);
    if(r.status===400 && /not\s*found|does not exist|no basket/i.test(txt)){ noteNet(true,''); return null; }
    noteNet(false, 'the lake answered ' + r.status + (txt?': '+txt:''));
    return null;
  }catch(e){ noteNet(false, 'this network is blocking the lake (' + (e && e.message ? e.message : 'no response') + ')'); return null; }
}
async function basketPost(b, obj){
  if(!usePantry) return false;
  try{
    const r = await fetch(pantryUrl(b), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(obj)});
    if(r.ok){ noteNet(true,''); return true; }
    const txt = (await r.text().catch(()=>'')).slice(0,120);
    noteNet(false, 'the lake answered ' + r.status + (txt?': '+txt:''));
    return false;
  }catch(e){ noteNet(false, 'this network is blocking the lake (' + (e && e.message ? e.message : 'no response') + ')'); return false; }
}
async function storeState(state){
  const id = randId();
  const ok = await basketPost('spg'+id, await sealJson(state));
  return ok ? id : null;
}
async function putState(id, state){ return basketPost('spg'+id, await sealJson(state)); }
/* returns state | null (missing/offline) | 'badkey' (wrong password) */
async function fetchState(id){
  const w = await basketGet('spg'+id);
  if(!w) return null;
  try{ const st = await openJson(w); return (st && Array.isArray(st.entries)) ? st : null; }
  catch(e){ return 'badkey'; }
}
/* games index: [{id,t,by,first,n,last,done}] */
async function getIndex(){
  const w = await basketGet(INDEX_BASKET);
  if(!w) return [];
  try{ const ix = await openJson(w); return (ix && Array.isArray(ix.games)) ? ix.games : []; }
  catch(e){ return 'badkey'; }
}
async function updateIndex(state){
  if(!state.room) return;
  let games = await getIndex();
  if(games==='badkey') return;
  const first = state.entries[0], last = state.entries[state.entries.length-1];
  const e = { id:state.room, t:state.t||Date.now(), by:first?first.a:'', first:(first&&first.t==='s')?String(first.c).slice(0,80):'',
              n:state.entries.length, last:last?last.a:'', done:!!state.done, u:state.u||'' };
  games = games.filter(g=>g.id!==state.room);
  games.unshift(e);
  await basketPost(INDEX_BASKET, await sealJson({games: games.slice(0,300)}));
}
/* Accepts: pass message / SPG code / link with #g=ID / bare id */
async function resolveInput(text){
  text = (text||'').trim();
  const inline = await unpackState(text);
  if(inline) return inline;
  const b = text.match(/SPGB\.([A-Za-z0-9\-]+?)(\.R)?(?![A-Za-z0-9\-])/);
  const g = text.match(/[#&?]g=([A-Za-z0-9\-]+)(?:&(r)=1)?/);
  const m = b || g;
  if(m){
    const st = await fetchState(m[1]);
    if(st==='badkey') return 'badkey';
    if(st){ if(m[2]) st.done = true; return st; }
    return 'fetchfail';
  }
  return null;
}

function pickExample(){ return EXAMPLE_SENTENCES[Math.floor(Math.random()*EXAMPLE_SENTENCES.length)]; }
function esc(str){ const d=document.createElement('div'); d.textContent=str==null?'':String(str); return d.innerHTML; }
function safeImg(src){ return (typeof src==='string' && src.startsWith('data:image/')) ? src : ''; }
function lastEntry(){ return S.state.entries[S.state.entries.length-1]; }
function nextIsDrawing(){ return lastEntry().t === 's'; }

function fmtDate(t){ try{ return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'}); }catch(e){ return ''; } }

function paintStrokes(canvas, strokes){
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const s of strokes){
    ctx.globalAlpha = s.h ? 0.35 : 1;
    ctx.strokeStyle = s.e ? '#fff' : (COLORS[s.c]||COLORS[0]);
    const base = SIZES[s.w]||5;
    ctx.lineWidth = s.e ? base*3 : (s.h ? base*2.5 : base);
    ctx.beginPath();
    const p = s.p||[];
    for(let i=0;i<p.length;i+=2){ if(i===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[i],p[i+1]); }
    if(p.length===2) ctx.lineTo(p[0]+.1,p[1]+.1);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function paneHtml(c){
  if(c && c.img) return `<img src="${safeImg(c.img)}" class="drawing" alt="drawing">`;
  return `<canvas class="drawing"></canvas>`;
}
function drawingHtml(entry){
  const c = entry.c || {};
  if(Array.isArray(c.p)) return `<div class="comic n${c.p.length}">` + c.p.map(x=>`<div class="comic-pane">${paneHtml(x)}</div>`).join('') + `</div>`;
  return paneHtml(c);
}
function hydrateDrawing(container, entry){
  const c = entry.c || {};
  const list = Array.isArray(c.p) ? c.p : [c];
  const cvs = container.querySelectorAll('canvas.drawing');
  let k = 0;
  list.forEach(x=>{ if(x && x.img) return; const cv = cvs[k++]; if(cv) paintStrokes(cv, (x && x.s) || []); });
}
function renderPrevEntry(container){
  const prev = lastEntry();
  if(prev.t==='s'){
    container.innerHTML = `<div class="who">${ICON_WROTE}${esc(prev.a)} wrote:</div><div class="sentence">${esc(prev.c)}</div>`;
  } else {
    container.innerHTML = `<div class="who">${ICON_DREW}${esc(prev.a)} drew:</div>` + drawingHtml(prev);
    hydrateDrawing(container, prev);
  }
}

/* ---------- BANNER EXPLORER: tap the banner to pan and zoom around it ---------- */
function openBannerViewer(){
  if(document.querySelector('.viewer')) return;
  const NATW = 1916, NATH = 821;
  const v = document.createElement('div'); v.className = 'viewer';
  v.innerHTML = `<div class="viewer-scroll" id="vScroll"><div class="viewer-stage" id="vStage"><img class="viewer-img" id="vImg" src="banner-full.jpg" alt="The Sentence Picture Game banner, up close" draggable="false"></div></div>
    <div class="viewer-hint" id="vHint">drag to look around · pinch or +/− to zoom</div>
    <div class="viewer-bar"><button id="vOut" aria-label="Zoom out">−</button><button id="vFit" aria-label="Show the whole banner">Fit</button><button id="vIn" aria-label="Zoom in">+</button><button class="close" id="vClose">Close</button></div>`;
  document.body.appendChild(v);
  document.body.style.overflow='hidden';
  const sc = v.querySelector('#vScroll'), stage = v.querySelector('#vStage'), img = v.querySelector('#vImg');
  const fitW = ()=> Math.min(sc.clientWidth*0.96, (sc.clientHeight*0.96)*NATW/NATH);
  const maxW = ()=> Math.max(NATW*1.6, fitW()*4);
  let w = 0;
  function setW(newW, cx, cy){
    newW = Math.max(fitW(), Math.min(maxW(), newW));
    // keep the point under (cx,cy) in place
    const r = img.getBoundingClientRect();
    const fx = w ? (cx - r.left)/r.width : .5, fy = w ? (cy - r.top)/r.height : .5;
    w = newW;
    img.style.width = w+'px'; img.style.height = (w*NATH/NATW)+'px';
    stage.style.width = Math.max(sc.clientWidth, w)+'px'; stage.style.height = Math.max(sc.clientHeight, w*NATH/NATW)+'px';
    const r2 = img.getBoundingClientRect(), sr = sc.getBoundingClientRect();
    sc.scrollLeft += (r2.left + fx*r2.width) - cx;
    sc.scrollTop  += (r2.top  + fy*r2.height) - cy;
  }
  const center = ()=>{ const sr = sc.getBoundingClientRect(); return [sr.left+sr.width/2, sr.top+sr.height/2]; };
  // open zoomed in enough to explore: fill the screen height on phones, ~1.8x on laptops
  const portrait = sc.clientHeight > sc.clientWidth;
  setW(fitW(), ...center());
  const startW = portrait ? sc.clientHeight*0.9*NATW/NATH : fitW()*1.8;
  setW(startW, ...center());
  sc.scrollLeft = 0; // start at the title
  sc.scrollTop = (sc.scrollHeight - sc.clientHeight) * 0.5;
  setTimeout(()=>{ const h=v.querySelector('#vHint'); if(h) h.style.opacity='0'; }, 2600);

  v.querySelector('#vIn').onclick = ()=> setW(w*1.4, ...center());
  v.querySelector('#vOut').onclick = ()=> setW(w/1.4, ...center());
  v.querySelector('#vFit').onclick = ()=> setW(fitW(), ...center());
  const close = ()=>{ v.remove(); document.body.style.overflow=''; document.removeEventListener('keydown', onKey); $('#bannerBtn') && $('#bannerBtn').focus(); };
  v.querySelector('#vClose').onclick = close;
  const onKey = e=>{ if(e.key==='Escape') close(); if(e.key==='+'||e.key==='=') setW(w*1.4, ...center()); if(e.key==='-') setW(w/1.4, ...center()); };
  document.addEventListener('keydown', onKey);
  // mouse: drag to pan, wheel to scroll, ctrl/cmd+wheel or trackpad pinch to zoom, double-click to zoom
  let drag = null;
  sc.addEventListener('pointerdown', e=>{ if(e.pointerType!=='mouse') return; drag={x:e.clientX,y:e.clientY,l:sc.scrollLeft,t:sc.scrollTop}; sc.classList.add('dragging'); sc.setPointerCapture(e.pointerId); });
  sc.addEventListener('pointermove', e=>{ if(!drag) return; sc.scrollLeft = drag.l - (e.clientX-drag.x); sc.scrollTop = drag.t - (e.clientY-drag.y); });
  const endDrag = ()=>{ drag=null; sc.classList.remove('dragging'); };
  sc.addEventListener('pointerup', endDrag); sc.addEventListener('pointercancel', endDrag);
  sc.addEventListener('wheel', e=>{ if(e.ctrlKey||e.metaKey){ e.preventDefault(); setW(w*Math.exp(-e.deltaY*0.01), e.clientX, e.clientY); } }, {passive:false});
  sc.addEventListener('dblclick', e=>{ setW(w < fitW()*2.5 ? w*2 : fitW(), e.clientX, e.clientY); });
  // touch: two-finger pinch zoom (one finger scrolls natively), double-tap zoom
  let pinch = null, lastTap = 0;
  sc.addEventListener('touchstart', e=>{
    if(e.touches.length===2){
      const [a,b] = e.touches;
      pinch = {d:Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), w, cx:(a.clientX+b.clientX)/2, cy:(a.clientY+b.clientY)/2};
    } else if(e.touches.length===1){
      const now = Date.now(), t = e.touches[0];
      if(now - lastTap < 300){ e.preventDefault(); setW(w < fitW()*2.5 ? w*2 : fitW(), t.clientX, t.clientY); lastTap = 0; } else lastTap = now;
    }
  }, {passive:false});
  sc.addEventListener('touchmove', e=>{
    if(pinch && e.touches.length===2){
      e.preventDefault();
      const [a,b] = e.touches;
      setW(pinch.w * Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY)/pinch.d, pinch.cx, pinch.cy);
    }
  }, {passive:false});
  sc.addEventListener('touchend', e=>{ if(e.touches.length<2) pinch=null; });
  window.addEventListener('resize', ()=>{ if(document.body.contains(v)) setW(w, ...center()); });
}
document.addEventListener('click', e=>{ if(e.target.closest && e.target.closest('#bannerBtn')) openBannerViewer(); });

/* ---------- INTRO: banner swoops in, then settles into place ---------- */
/* full-resolution banner for the intro tour, fetched while the password page is open */
let FULL_BANNER = null;
function preloadFullBanner(){ if(!FULL_BANNER){ FULL_BANNER = new Image(); FULL_BANNER.src = 'banner-full.jpg'; } return FULL_BANNER; }

function playIntro(){
  return new Promise(async resolve=>{
    const brand = document.querySelector('.brand');
    const banner = document.querySelector('.banner');
    brand.classList.add('intro');
    app.classList.add('intro-hold');
    S.screen='home'; render();
    window.scrollTo({top:0});
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    let overlay = null;
    const finish = ()=>{
      if(finish.done) return; finish.done = true;
      brand.classList.remove('intro');
      app.classList.remove('intro-hold'); app.classList.add('intro-in');
      setTimeout(()=>app.classList.remove('intro-in'), 700);
      if(overlay) overlay.remove();
      resolve();
    };
    if(reduce || !banner.animate){ finish(); return; }
    // wait (briefly) for the sharp version so the close-ups look crisp
    const full = preloadFullBanner();
    const ready = (im)=> im.complete && im.naturalWidth ? Promise.resolve() : (im.decode ? im.decode() : Promise.resolve());
    let src = banner.currentSrc || banner.src;
    try{ await Promise.race([ready(full), new Promise((_,rej)=>setTimeout(rej, 2500))]); src = full.src; }catch(e){}
    try{ await banner.decode(); }catch(e){}

    const t = banner.getBoundingClientRect();
    const vw = innerWidth, vh = innerHeight;
    const cx = t.left + t.width/2, cy = t.top + t.height/2;
    // zoom so the art covers the whole screen with room to roam
    const Z = Math.max(vh*1.25/t.height, vw*1.9/t.width);
    const W = t.width*Z, H = t.height*Z;
    // camera position: fx/fy = 0..1 across the part of the art that's off-screen
    const view = (fx, fy)=>{
      const dx = W/2 - cx - fx*(W - vw);
      const dy = H/2 - cy - fy*Math.max(0, H - vh);
      return `translate(${dx}px,${dy}px) scale(1)`;
    };

    overlay = document.createElement('div');
    overlay.className = 'intro-overlay';
    const img = document.createElement('img');
    img.className = 'intro-img'; img.src = src; img.alt = '';
    Object.assign(img.style, {
      left:(cx - W/2)+'px', top:(cy - H/2)+'px', width:W+'px', height:H+'px',
      border:(3*Z)+'px solid transparent', borderRadius:'0px'
    });
    const hint = document.createElement('div'); hint.className='intro-skip'; hint.textContent='tap to skip';
    overlay.append(img, hint);
    document.body.appendChild(overlay);
    overlay.addEventListener('click', finish);

    const D = 7000;
    const tour = img.animate([
      {offset:0,    transform:view(0, 0.5), opacity:0, borderColor:'transparent', borderRadius:'0px'},   // left edge: the title
      {offset:0.05, transform:view(0, 0.5), opacity:1, easing:'cubic-bezier(.35,0,.65,1)'},
      {offset:0.78, transform:view(1, 0.5), easing:'cubic-bezier(.6,0,.2,1)', borderColor:'transparent', borderRadius:'0px'}, // slow pan to the right edge
      {offset:1,    transform:`translate(0px,0px) scale(${1/Z})`, opacity:1, borderColor:'#121212', borderRadius:(16*Z)+'px'} // shrink into the banner spot
    ], {duration:D, fill:'forwards'});
    hint.animate([{opacity:0},{opacity:1,offset:.1},{opacity:1,offset:.7},{opacity:0,offset:.8},{opacity:0}], {duration:D, fill:'forwards'});
    overlay.animate([{backgroundColor:'rgba(255,255,255,1)'},{backgroundColor:'rgba(255,255,255,1)',offset:.8},{backgroundColor:'rgba(255,255,255,0)'}], {duration:D, fill:'forwards'});
    tour.onfinish = finish;
    setTimeout(finish, D + 2000); // safety net
  });
}

async function loadHome(){
  const hint = $('#paperHint'), btn = $('#checkBtn'), list = $('#pastList');
  const games = await getIndex();
  if(!$('#paperHint')) return; // navigated away
  if(games==='badkey'){ wrongPassword(); return; }
  if(!lastNet.ok){
    hint.innerHTML = `<b>Can\u2019t reach the lake right now.</b> ${esc(lastNet.what)}.<br>In-flight and hotel wifi usually cause this. Try again on cellular or home wifi.`;
    btn.textContent='Try again'; btn.disabled=false; btn.onclick=()=>render();
    list.textContent='Past games will show up once the lake is reachable.';
    return;
  }
  S.index = games;
  const lr = localRoom();
  let active = games.find(g=>g.id===lr && !g.done) || games.find(g=>!g.done) || null;
  S.activeGame = active;
  if(active){
    const who = active.last ? `${esc(active.last)} just finished fold ${active.n}` : `${esc(active.by)} started it`;
    hint.innerHTML = `A game is going: ${who}. Tap to see if it’s your turn.`;
    btn.disabled = false;
    btn.onclick = async ()=>{
      btn.disabled = true; btn.textContent = 'Checking…';
      const st = await fetchState(active.id);
      if(st==='badkey'){ wrongPassword(); return; }
      if(!st){ S.err='Couldn’t reach the paper. Check your connection and try again.'; render(); return; }
      enterState(st);
    };
  } else {
    hint.textContent = games.length ? 'No game in progress right now. Start a new one below.' : 'No games yet. Start the first one below.';
    btn.classList.add('hidden');
  }
  if(!games.length){ list.textContent = 'Nothing here yet. Finished games will show up here so you can read them again.'; return; }
  list.className = 'gamelist';
  list.innerHTML = games.map(g=>`
    <button class="gamerow" data-id="${esc(g.id)}">
      <span class="gdate">${esc(fmtDate(g.t))}</span>
      <span class="gmain"><span class="gtitle">${esc(g.first || (g.by+'’s game'))}</span><br><span class="gmeta">started by ${esc(g.by)} · ${g.n} fold${g.n===1?'':'s'}</span></span>
      <span class="gstatus ${g.done?'':'live'}">${g.done?'done':'in play'}</span>
    </button>`).join('');
  list.querySelectorAll('.gamerow').forEach(row=>row.onclick = async ()=>{
    row.style.opacity='.6';
    const st = await fetchState(row.dataset.id);
    if(st==='badkey'){ wrongPassword(); return; }
    if(!st){ S.err='Couldn’t load that game right now.'; render(); return; }
    enterState(st);
  });
}
async function loadFromInput(text){
  const st = await resolveInput(text);
  if(st==='badkey'){ S.err='That code is scrambled with a different family password.'; render(); return; }
  if(st==='fetchfail'){ S.err='Found the link but couldn’t load the fold. Check your connection.'; render(); return; }
  if(!st){ S.err='That doesn’t look like a game code. Paste the whole message.'; render(); return; }
  enterState(st);
}
async function loadFromHash(hash){
  const st = await resolveInput(decodeURIComponent(hash));
  if(st==='badkey'){ wrongPassword(); return; }
  if(st && st!=='fetchfail'){ enterState(st); return; }
  S.err = st==='fetchfail' ? 'This link’s fold couldn’t be loaded. Check your connection and refresh.' : '';
  S.screen='home'; render();
}

/* ---------- name field ---------- */
function nameFieldHtml(){
  const name = S.myName || lsGet('spgName') || '';
  return `<div class="field"><label for="myName">Your name</label>
    <input id="myName" maxlength="24" placeholder="e.g. Han Solo" autocomplete="off" value="${esc(name)}"></div>`;
}
function grabName(){ const el=$('#myName'); if(el){ S.myName=el.value.trim(); if(S.myName) lsSet('spgName', S.myName); } return S.myName; }

/* ---------- WRITE ---------- */
function renderWrite(){
  const first = S.state.entries.length===0;
  app.innerHTML = `
  <div class="card">
    <span class="round-pill">fold ${foldNum()}</span>
    <div class="prompt-label">${first ? 'Start the strip' : 'What is going on in this picture?'}</div>
    ${first
      ? `<p class="hint">Write anything. The weirder, the better. The next person has to draw it.</p>`
      : `<div class="prev-entry" id="prev"></div><p class="hint">Describe it. Only the last fold is shown, no peeking further back.</p>`}
    <textarea class="write" id="sentence" placeholder="${first ? esc(pickExample()) : 'I see…'}"></textarea>
    ${first ? '' : nameFieldHtml()}
    <button class="btn" id="passBtn">Fold it</button>
    <div class="errmsg">${esc(S.err)}</div>
  </div>`;
  if(!first) renderPrevEntry($('#prev'));
  const ta = $('#sentence');
  const grow = ()=>{
    // fit what's typed, or the example sentence when the box is empty
    const empty = !ta.value; if(empty) ta.value = ta.placeholder;
    ta.style.height='auto'; ta.style.height = Math.max(144, ta.scrollHeight + 6) + 'px';
    if(empty) ta.value = '';
  };
  ta.addEventListener('input', grow); grow();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(document.body.contains(ta)) grow(); });
  $('#passBtn').onclick = async ()=>{
    const text = ta.value.trim();
    const name = first ? S.myName : grabName();
    if(!name){ S.err='Add your name so the family knows who to blame.'; render(); return; }
    if(!text){ S.err='Write something first, anything.'; render(); return; }
    S.err='';
    S.state.entries.push({t:'s', a:name, c:text});
    await gotoPass();
  };
}

/* ---------- DRAW ---------- */
function renderDraw(){
  app.innerHTML = `
  <div class="card">
    <span class="round-pill">fold ${foldNum()}</span>
    <div class="prompt-label">Draw this</div>
    <div class="draw-grid">
      <div class="draw-side">
        <div class="prev-entry" id="prev"></div>
        <div class="pane-tabs" id="paneTabs"></div>
        <div class="toolbar" id="tools"></div>
      </div>
      <div class="draw-main">
        <div class="canvas-holder" id="holder"></div>
        <p class="hint" style="margin:8px 0 0">Want a comic strip? Tap <b>+ Add a panel</b>. Or add a photo and draw on top of it.</p>
        <div style="height:12px"></div>
        ${nameFieldHtml()}
        <button class="btn" id="passBtn">Fold it</button>
        <div class="errmsg">${esc(S.err)}</div>
      </div>
    </div>
  </div>`;
  renderPrevEntry($('#prev'));
  const board = makeBoard($('#holder'), $('#tools'), $('#paneTabs'));
  $('#passBtn').onclick = async ()=>{
    const name = grabName();
    if(!name){ S.err='Add your name so the family knows who to blame.'; render(); return; }
    if(board.isBlank()){ S.err='A blank page? Give us at least a squiggle.'; render(); return; }
    S.err='';
    S.state.entries.push({t:'d', a:name, c: board.exportContent()});
    await gotoPass();
  };
}

function makeBoard(holder, toolsEl, tabsEl){
  const tool = {c:0, w:1, e:false, h:false};
  const panes = []; let active = 0;
  const fileInput = document.createElement('input');
  fileInput.type='file'; fileInput.accept='image/*'; fileInput.style.display='none';
  holder.appendChild(fileInput);
  fileInput.addEventListener('change', ()=>{
    const f = fileInput.files && fileInput.files[0];
    if(f && panes[active]) panes[active].pad.addPhoto(f, buildTools);
    fileInput.value='';
  });
  function addPane(){
    if(panes.length>=MAX_PANES) return;
    const cv = document.createElement('canvas');
    cv.width=W; cv.height=H; cv.className='pad';
    holder.appendChild(cv);
    panes.push({cv, pad: makePad(cv, tool)});
    setActive(panes.length-1);
  }
  function removePane(i){
    if(panes.length<=1) return;
    holder.removeChild(panes[i].cv); panes.splice(i,1);
    setActive(Math.min(active, panes.length-1));
  }
  function setActive(i){
    active = i;
    panes.forEach((p,j)=> p.cv.style.display = j===i ? 'block' : 'none');
    buildTabs(); buildTools();
  }
  function buildTabs(){
    tabsEl.innerHTML = panes.map((p,i)=>`<button class="tab ${i===active?'sel':''}" data-i="${i}">Panel ${i+1}</button>`).join('')
      + (panes.length<MAX_PANES ? `<button class="tab add" id="addPane">+ Add a panel</button>` : '')
      + (panes.length>1 ? `<button class="tab del" id="delPane">Remove this panel</button>` : '');
    tabsEl.querySelectorAll('.tab[data-i]').forEach(b=> b.onclick = ()=> setActive(+b.dataset.i));
    const add = $('#addPane'); if(add) add.onclick = addPane;
    const del = $('#delPane'); if(del) del.onclick = ()=> removePane(active);
  }
  function buildTools(){
    const pad = panes[active].pad;
    toolsEl.innerHTML = COLORS.map((c,i)=>
      `<button class="swatch ${i===tool.c&&!tool.e&&!tool.h?'sel':''}" data-i="${i}" style="background:${c}" aria-label="color"></button>`).join('')
      + SIZES.map((s,i)=>
      `<button class="sizebtn ${i===tool.w?'sel':''}" data-i="${i}" aria-label="brush size"><span style="width:${Math.min(s+3,20)}px;height:${Math.min(s+3,20)}px"></span></button>`).join('')
      + `<button class="tool ${tool.h?'sel':''}" id="hilite">Hi-liter</button>
         <button class="tool ${tool.e?'sel':''}" id="eraser">Eraser</button>
         <button class="tool" id="undo">Undo</button>
         <button class="tool" id="clear">Clear</button>
         <button class="tool" id="addphoto">${pad.hasPhoto()?'Swap photo':'Add photo'}</button>`;
    toolsEl.querySelectorAll('.swatch').forEach(b=> b.onclick=()=>{ tool.c=+b.dataset.i; tool.e=false; tool.h=false; buildTools(); });
    toolsEl.querySelectorAll('.sizebtn').forEach(b=> b.onclick=()=>{ tool.w=+b.dataset.i; buildTools(); });
    $('#hilite').onclick=()=>{ tool.h=!tool.h; tool.e=false; buildTools(); };
    $('#eraser').onclick=()=>{ tool.e=!tool.e; tool.h=false; buildTools(); };
    $('#undo').onclick=()=> pad.undo();
    $('#clear').onclick=()=>{ pad.clear(); buildTools(); };
    $('#addphoto').onclick=()=> fileInput.click();
  }
  addPane();
  return {
    isBlank: ()=> panes.every(p=>p.pad.isBlank()),
    exportContent: ()=>{
      const cs = panes.filter(p=>!p.pad.isBlank()).map(p=>p.pad.exportContent());
      return cs.length===1 ? cs[0] : {p: cs};
    },
  };
}

function makePad(canvas, tool){
  const ctx = canvas.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  ctx.lineCap='round'; ctx.lineJoin='round';
  let strokes=[], current=null, bgImg=null;
  function pos(ev){
    const r = canvas.getBoundingClientRect();
    return { x:(ev.clientX-r.left)*W/r.width, y:(ev.clientY-r.top)*H/r.height };
  }
  function drawBg(){
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
    if(bgImg){
      const sc = Math.min(W/bgImg.width, H/bgImg.height);
      const dw = bgImg.width*sc, dh = bgImg.height*sc;
      ctx.drawImage(bgImg, (W-dw)/2, (H-dh)/2, dw, dh);
    }
  }
  function redraw(){ drawBg(); for(const s of strokes) paintLive(s); }
  function paintLive(s){
    ctx.globalAlpha = s.h ? 0.35 : 1;
    ctx.strokeStyle = s.e ? '#fff' : COLORS[s.c];
    const base = SIZES[s.w];
    ctx.lineWidth = s.e ? base*3 : (s.h ? base*2.5 : base);
    ctx.beginPath();
    s.pts.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    if(s.pts.length===1) ctx.lineTo(s.pts[0].x+.1,s.pts[0].y+.1);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  canvas.addEventListener('touchstart', ev=>ev.preventDefault(), {passive:false});
  canvas.addEventListener('touchmove', ev=>ev.preventDefault(), {passive:false});
  canvas.addEventListener('pointerdown', ev=>{
    canvas.setPointerCapture(ev.pointerId);
    current={c:tool.c, w:tool.w, e:tool.e?1:0, h:tool.h?1:0, pts:[pos(ev)]};
    strokes.push(current); paintLive(current);
  });
  canvas.addEventListener('pointermove', ev=>{
    if(!current) return;
    const p = pos(ev), lp = current.pts[current.pts.length-1];
    if(Math.hypot(p.x-lp.x, p.y-lp.y) >= 2){ current.pts.push(p); redraw(); }
  });
  const up=()=>{ current=null; };
  canvas.addEventListener('pointerup',up);
  canvas.addEventListener('pointercancel',up);
  function thin(pts){
    if(pts.length<3) return pts;
    const out=[pts[0]];
    for(let i=1;i<pts.length-1;i++){ const l=out[out.length-1]; if(Math.hypot(pts[i].x-l.x, pts[i].y-l.y) >= 2.5) out.push(pts[i]); }
    out.push(pts[pts.length-1]); return out;
  }
  return {
    isBlank: ()=> strokes.length===0 && !bgImg,
    hasPhoto: ()=> !!bgImg,
    undo: ()=>{ strokes.pop(); redraw(); },
    clear: ()=>{ strokes=[]; bgImg=null; redraw(); },
    addPhoto: (file, done)=>{
      const img = new Image();
      img.onload = ()=>{ bgImg = img; redraw(); if(done) done(); };
      img.src = URL.createObjectURL(file);
    },
    exportContent: ()=>{
      if(bgImg){ redraw(); return { img: canvas.toDataURL('image/jpeg', 0.55) }; }
      return { s: strokes.map(s=>({ c:s.c, w:s.w, e:s.e, h:s.h, p: thin(s.pts).flatMap(p=>[Math.round(p.x), Math.round(p.y)]) })) };
    },
  };
}

/* ---------- PASS ---------- */
let passCode='', revealCode='', saved=false;
async function gotoPass(){
  S.screen='pass'; S.passReady=false; render();
  saved = false;
  if(S.state.room){
    const latest = await fetchState(S.state.room);
    if(latest && latest!=='badkey' && latest.entries.length !== S.state.entries.length - 1){
      S.err = 'Someone else already added fold ' + latest.entries.length + ' while you were working. Here’s the newest fold instead.';
      enterState(latest); return;
    }
    saved = await putState(S.state.room, S.state);
  } else {
    const id = await storeState(S.state);
    if(id){ S.state.room = id; saved = await putState(id, S.state); }
  }
  if(saved){ saveLocalRoom(); await updateIndex(S.state); }
  passCode = await packState(S.state);
  revealCode = await packState({...S.state, done:true});
  S.passReady=true; render();
}
function gameLink(tail){ return S.state.u ? S.state.u.split('#')[0] + '#' + tail : ''; }
function passMessage(){
  const n = S.state.entries.length;
  const link = S.state.room && S.state.u ? '\nFirst time? Tap: ' + gameLink('g='+S.state.room) : '';
  return `Sentence Picture: fold ${n} is done and it’s YOUR turn. Open the game and tap “Check the paper”.${link}`;
}
function revealMessage(){
  const link = S.state.room && S.state.u ? '\nFirst time? Tap: ' + gameLink('g='+S.state.room+'&r=1') : '';
  return `Sentence Picture: the paper is FULL. Open the game and tap “Check the paper” to unfold everything.${link}`;
}
function codeMessage(){
  return `Sentence Picture: fold ${S.state.entries.length} is done and it’s YOUR turn. Open the game, paste this whole message in the “pass-along code” box, and tap Take my turn.\n\n${passCode}`;
}
function codeRevealMessage(){
  return `Sentence Picture: the paper is FULL. Open the game, paste this whole message in the “pass-along code” box, and unfold everything.\n\n${revealCode}`;
}
async function markDoneEverywhere(){
  S.state.done = true;
  if(S.state.room){ await putState(S.state.room, S.state); await updateIndex(S.state); }
}
async function shareText(text, btn, doneLabel){
  if(navigator.share){
    try{ await navigator.share({text}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  try{
    await navigator.clipboard.writeText(text);
    const old = btn.textContent; btn.textContent = doneLabel;
    setTimeout(()=>{ btn.textContent = old; }, 2500);
  }catch(e){ S.err='Couldn’t open the share sheet. Long-press the message box to copy it.'; render(); }
}
function renderPass(){
  const n = S.state.entries.length;
  const nextTask = nextIsDrawing() ? 'draw it' : 'caption it';
  if(!S.passReady){
    app.innerHTML = `<div class="card"><div class="bigmark">${ICON_DREW.replace('class="ico"','style="width:72px;height:72px;color:#19B7F2"')}</div>
      <h2 style="text-align:center">Folding it up…</h2>
      <p class="hint" style="text-align:center;margin:0">Scrambling fold ${n} and tucking it into the lake.</p></div>`;
    return;
  }
  app.innerHTML = `
  <div class="card">
    <h2 style="text-align:center">Fold ${n} is in</h2>
    <p class="hint" style="text-align:center">${saved
      ? `The paper is saved. Nudge the next player: they open the game, tap <b>Check the paper</b>, and ${nextTask}.`
      : `<b>Heads up:</b> the paper couldn’t be saved to the lake. Use the full-text code below so this fold isn’t lost.<br><span style="font-size:12px">Why: ${esc(lastNet.what || 'unknown')}. In-flight and hotel wifi usually cause this; it works again on cellular or home wifi.</span>`}</p>
    ${saved ? `<button class="btn" id="shareTurn">Nudge the next player</button>` : ''}
    ${n>=2 && saved ? `<button class="btn gold" id="shareReveal">We’re done, tell everyone to unfold it</button>` : ''}
    ${n>=2 ? `<button class="btn alt" id="revealNow">Unfold it right here</button>` : ''}
    ${saved ? '' : `<button class="btn gold" id="codeTurn">Send as a full-text code</button>
    ${n>=2 ? `<button class="btn alt" id="codeReveal">Send the reveal as a full-text code</button>` : ''}`}
    <div class="divider">PAPER COME BACK TO YOU?</div>
    <button class="btn lake" id="checkHere">Check the paper</button>
    <button class="btn alt" id="homeBtn">Back to the dock</button>
    <div class="errmsg">${esc(S.err)}</div>
  </div>`;
  if($('#shareTurn')) $('#shareTurn').onclick = e => shareText(passMessage(), e.target, 'Copied, paste it in a text');
  if($('#shareReveal')) $('#shareReveal').onclick = async e => { await markDoneEverywhere(); shareText(revealMessage(), e.target, 'Copied, paste it in the group text'); };
  if($('#revealNow')) $('#revealNow').onclick = async ()=>{ await markDoneEverywhere(); S.screen='reveal'; S.revealShown=1; render(); };
  if($('#codeTurn')) $('#codeTurn').onclick = e => shareText(codeMessage(), e.target, 'Copied');
  if($('#codeReveal')) $('#codeReveal').onclick = async e => { await markDoneEverywhere(); shareText(codeRevealMessage(), e.target, 'Copied'); };
  $('#checkHere').onclick = async e=>{
    const id = S.state.room;
    if(!id){ S.err='This game isn’t saved to the lake, so there’s nothing to check yet.'; render(); return; }
    e.target.disabled=true; e.target.textContent='Checking…';
    const st = await fetchState(id);
    if(st==='badkey'){ wrongPassword(); return; }
    if(!st){ S.err='Couldn’t reach the paper. Try again in a moment.'; render(); return; }
    if(st.entries.length === S.state.entries.length && !st.done){ S.err='Still waiting on the next player.'; render(); return; }
    enterState(st);
  };
  $('#homeBtn').onclick = ()=>{ S.err=''; S.screen='home'; render(); };
}

/* ---------- REVEAL ---------- */
function renderReveal(){
  const entries = S.state.entries, n = entries.length;
  let panels='';
  for(let i=0;i<Math.min(S.revealShown,n);i++){
    const e = entries[i];
    panels += `<div class="panel" data-p="${i}">
      <div class="who">${e.t==='s'?ICON_WROTE:ICON_DREW}${esc(e.a)} ${e.t==='s'?'wrote':'drew'}</div>
      ${e.t==='s' ? `<div class="sentence">${esc(e.c)}</div>` : drawingHtml(e)}
    </div>`;
  }
  const done = S.revealShown >= n;
  app.innerHTML = `
  <div class="strip-shadowbox"><div class="strip">${panels}
    ${done?'':`<button class="foldbtn" id="unfoldBtn">Unfold the next one</button>`}
  </div></div>
  <div class="reveal-actions">
    ${done ? '' : `<button class="btn alt" id="showAll">Show the whole strip</button>`}
    ${done && S.state.room ? `<button class="btn gold" id="shareReveal2">Tell the family to unfold it</button>` : ''}
    <button class="btn alt" id="againBtn">Back to the dock</button>
  </div>`;
  app.querySelectorAll('.panel[data-p]').forEach(pn=>{ const e = entries[+pn.dataset.p]; if(e.t==='d') hydrateDrawing(pn, e); });
  if($('#unfoldBtn')) $('#unfoldBtn').onclick = ()=>{
    S.revealShown++; render();
    const ps = app.querySelectorAll('.panel'); const newest = ps[ps.length-1];
    if(newest) setTimeout(()=> newest.scrollIntoView({behavior:'smooth', block:'nearest'}), 60);
  };
  if($('#showAll')) $('#showAll').onclick = ()=>{ S.revealShown = n; render(); };
  if($('#shareReveal2')) $('#shareReveal2').onclick = async e=>{ await markDoneEverywhere(); shareText(revealMessage(), e.target, 'Copied, paste it in the group text'); };
  $('#againBtn').onclick = ()=>{ S.state=null; S.screen='home'; S.err=''; render(); };
}

/* ---------- boot ---------- */
(async function boot(){
  await loadPassword();
  let hash = location.hash || '';
  try{ if(!/SPG|g=/.test(hash) && window.top !== window) hash = window.top.location.hash || hash; }catch(e){}
  if(/SPG|g=/.test(hash)){
    history.replaceState(null, '', location.pathname + location.search);
    if(!S.key){ S.pendingHash = hash; S.screen='password'; render(); return; }
    await loadFromHash(hash); return;
  }
  S.screen = S.key ? 'home' : 'password';
  render();
})();
</script>
